<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Userscript fixture</title>
    <style>
      body { font: 18px system-ui; max-width: 760px; margin: 40px auto; padding: 16px; }
      button, input { font: inherit; padding: 8px; margin: 8px 0; }
      main { border: 1px solid #888; padding: 20px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <h1>Userscript interaction fixture</h1>
    <label>Search <input id="search" type="search"></label>
    <p><button id="replace-route" type="button">Replace main and navigate</button></p>
    <main id="fixture-main"><h2>Source article</h2><p>ARTICLE_SENTINEL</p></main>
    <script>
      window.fixtureSiteKeys = [];
      document.addEventListener('keydown', (event) => {
        if (event.key === 's') window.fixtureSiteKeys.push(event.key);
      }, true);
      document.getElementById('replace-route').addEventListener('click', () => {
        history.pushState({}, '', '/two');
        const replacement = document.createElement('main');
        replacement.id = 'fixture-main';
        const heading = document.createElement('h2');
        heading.textContent = 'Replacement article';
        replacement.append(heading);
        document.getElementById('fixture-main').replaceWith(replacement);
      });
    </script>
  </body>
</html>
