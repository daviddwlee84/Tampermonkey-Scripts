<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><title>Threads modeled fixture</title>
  <style>
    body {
      font: 16px system-ui;
      margin: 24px;
    }
    main {
      max-width: 650px;
    }
    .post,
    [role='article'] {
      padding: 20px;
      border: 1px solid #aaa;
      margin: 12px;
    }
    button {
      padding: 8px;
    }
    .quote {
      background: #aaa2;
    }
  </style>
  <main>
    <div id="post-a" class="post" data-pressable-container="true">
      <a href="/@alice/post/ALICE?xmt=parent&utm_source=feed"><time>1 小時</time></a>
      <p>Alice 的貼文</p>
      <div class="quote" id="quote" role="article" data-pressable-container="true">
        <a href="/@quoted/post/QUOTED?xmt=quote"><time>昨天</time></a>
        <p>引用原文</p>
        <div class="actions">
          <div role="button" tabindex="0" id="share-quote">
            <svg role="img" title="Share" width="20" height="20"><title>Share</title></svg>2
          </div>
        </div>
      </div>
      <div class="actions">
        <button id="like-a">Like</button>
        <div role="button" tabindex="0" id="share-a">
          <svg aria-label="Share" width="20" height="20"></svg>13
        </div>
      </div>
    </div>
    <div id="post-b" class="post" data-pressable-container="true">
      <a href="/@bob/post/BOB?xmt=b"><time>2 小時</time></a>
      <p>Bob 的貼文</p>
      <div class="actions"><button id="share-b" aria-label="分享">✈</button></div>
    </div>
    <div id="unlinked" class="post" data-pressable-container="true">
      <p>尚未取得 permalink 的貼文</p>
      <button aria-label="Share">✈</button>
    </div>
  </main>
  <script>
    window.nativeClicks = 0;
    document.querySelector('main').addEventListener('click', () => window.nativeClicks++);
  </script>
</html>
