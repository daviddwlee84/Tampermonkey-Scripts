name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # scripts/ 只用 Node 內建模組，所以驗證不需要 npm install。
      - name: Validate userscript metadata
        run: node scripts/check-meta.mjs

      - name: Ensure README script index is up to date
        run: node scripts/build-index.mjs --check

  vim-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:vim-navigation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vim-navigation-screenshots
          path: .preview/vim-navigation-tests/*.png
          if-no-files-found: ignore
          include-hidden-files: true
